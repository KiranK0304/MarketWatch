<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketWatch — Professional Terminal & Movers Scanner</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    :root {
      /* Theme: White / Light default */
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      --border: #e2e8f0;
      --border-subtle: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: #eff6ff;
      --bullish: #16a34a;
      --bullish-subtle: #dcfce7;
      --bearish: #dc2626;
      --bearish-subtle: #fee2e2;
      --purple: #8b5cf6;
      --purple-subtle: #f3e8ff;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --chart-bg: #ffffff;
      --chart-grid: #f1f5f9;
      --chart-text: #64748b;
    }

    body.dark-theme {
      --bg-app: #090d16;
      --bg-surface: #111726;
      --bg-subtle: #192237;
      --bg-hover: #222d46;
      --border: #232e47;
      --border-subtle: #2d3b5b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-subtle: #172554;
      --bullish: #22c55e;
      --bullish-subtle: #052e16;
      --bearish: #ef4444;
      --bearish-subtle: #450a0a;
      --purple: #a855f7;
      --purple-subtle: #3b0764;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --chart-bg: #111726;
      --chart-grid: #1a233a;
      --chart-text: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      user-select: none;
    }

    /* 1. Ultra-Slim Left Navigation Rail */
    .nav-rail {
      width: 56px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 10px;
      z-index: 30;
      flex-shrink: 0;
    }

    .rail-brand {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      color: white;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .rail-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .rail-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .rail-btn.active {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .rail-btn.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .rail-spacer { flex: 1; }

    /* 2. Collapsible Watchlist / Screener Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease;
      z-index: 20;
    }

    .sidebar.collapsed {
      width: 0;
      overflow: hidden;
      border-right: none;
    }

    .sidebar-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-tabs {
      display: flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 7px;
      gap: 3px;
    }

    .sidebar-tab-btn {
      flex: 1;
      padding: 6px;
      font-size: 11px;
      font-weight: 600;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.1s ease;
    }

    .sidebar-tab-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      padding: 6px 10px 6px 28px;
      font-size: 12px;
      font-family: var(--font-sans);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--bg-surface);
    }

    .search-icon {
      position: absolute;
      left: 8px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .movers-subbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 4px;
    }

    .threshold-chip {
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font-mono);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .threshold-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .stock-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .stock-row {
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .stock-row:hover { background: var(--bg-hover); }
    .stock-row.active {
      background: var(--accent-subtle);
      border-left: 3px solid var(--accent);
    }

    .stock-sym-title {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
    }

    .stock-corp-name {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stock-badge-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .stock-badge-pill.up { background: var(--bullish-subtle); color: var(--bullish); }
    .stock-badge-pill.down { background: var(--bearish-subtle); color: var(--bearish); }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
    }

    .add-btn {
      width: 100%;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .add-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 3. Main Stage */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-app);
      position: relative;
    }

    /* Minimalist Top Bar */
    .top-bar {
      height: 48px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stock-hero-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 7px;
    }

    .hero-sym {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
    }

    .hero-price {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
    }

    .hero-chg {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 11px;
    }

    /* Timeframe Segments */
    .tf-segmented {
      display: flex;
      background: var(--bg-subtle);
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--border);
      gap: 2px;
    }

    .tf-seg-btn {
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
    }

    .tf-seg-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Compact Zoom Dial */
    .zoom-dial-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }

    .zoom-dial-wrapper input[type="range"] {
      width: 60px;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .top-action-btn {
      height: 32px;
      padding: 0 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .top-action-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .top-action-btn.active {
      background: var(--accent-subtle);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Viewport / Chart Canvas Area */
    .viewport-area {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .chart-box {
      flex: 1;
      height: 100%;
      position: relative;
    }

    /* OHLC Banner */
    .ohlc-strip {
      position: absolute;
      top: 10px;
      left: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(var(--bg-surface), 0.85);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .ohlc-strip span { font-weight: 700; color: var(--text-primary); }

    /* Floating Tooltip */
    .candle-float-tip {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 25;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 5px;
      box-shadow: var(--shadow-md);
      transform: translate(-50%, -100%);
      margin-top: -12px;
      white-space: nowrap;
    }
    .candle-float-tip.up { background: rgba(22, 163, 74, 0.95); color: #fff; }
    .candle-float-tip.down { background: rgba(220, 38, 38, 0.95); color: #fff; }

    /* Multi-Chart Grid View */
    #grid-box {
      display: none;
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 14px;
    }

    .grid-chart-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      height: 260px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .grid-chart-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .grid-chart-canvas {
      flex: 1;
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
    }

    /* 4. Collapsible Right Drawer: Intelligence, Fundamentals & AI */
    .intel-drawer {
      width: 380px;
      background: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease;
      z-index: 20;
    }

    .intel-drawer.collapsed {
      width: 0;
      overflow: hidden;
      border-left: none;
    }

    .drawer-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-nav-tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-subtle);
      padding: 2px;
      border-radius: 6px;
    }

    .drawer-tab {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
      cursor: pointer;
    }

    .drawer-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Cards inside Drawer */
    .drawer-card {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-card-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 11px;
    }

    .metric-box {
      background: var(--bg-surface);
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid var(--border-subtle);
    }

    .metric-lbl { color: var(--text-muted); font-size: 10px; }
    .metric-val { font-weight: 700; font-family: var(--font-mono); margin-top: 2px; }

    .ai-insight-box {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(168, 85, 247, 0.08));
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 7px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cmd-snippet {
      background: var(--bg-app);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .cmd-snippet code {
      overflow-x: auto;
      white-space: nowrap;
      user-select: text;
    }

    .copy-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }
    .copy-chip:hover { background: var(--accent); color: white; }

    /* 5. Bottom Status Strip */
    .status-strip {
      height: 26px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bullish);
    }

    /* 6. Command Palette Overlay (Ctrl+K) */
    .palette-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 120px;
    }

    .palette-backdrop.open { display: flex; }

    .palette-box {
      width: 540px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .palette-input-box {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .palette-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: var(--font-sans);
      color: var(--text-primary);
    }

    .palette-results {
      max-height: 320px;
      overflow-y: auto;
      padding: 6px 0;
      list-style: none;
    }

    .palette-item {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
    }

    .palette-item:hover, .palette-item.selected {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .palette-item-tag {
      font-size: 10px;
      font-family: var(--font-mono);
      background: var(--bg-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    /* Modal dialog */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 150;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-lg);
    }

    .modal-input {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .modal-input:focus { border-color: var(--accent); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40px;
      right: 20px;
      background: var(--text-primary);
      color: var(--bg-app);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- 1. Left Icon Rail -->
  <aside class="nav-rail">
    <div class="rail-brand" title="MarketWatch Pro">MW</div>

    <button class="rail-btn active" id="btn-rail-chart" title="Single Chart View">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
    </button>

    <button class="rail-btn" id="btn-rail-grid" title="Multi-Chart Grid View for Movers">

  <!-- 7. Add Stock Modal -->
  <div class="modal-backdrop" id="modal-add">

      <input type="text" class="modal-input" id="input-new-sym" placeholder="NSE Symbol (e.g. TATAMOTORS.NS)">
      <input type="text" class="modal-input" id="input-new-name" placeholder="Company Name (e.g. Tata Motors)">

  <div class="toast" id="toast"></div>

  <script>
    // State
    let stocks = [];
    let currentIndex = 0;
    let currentTimeframe = '15m';
    let currentViewMode = 'single'; // 'single' | 'grid'
    let currentTab = 'universe'; // 'universe' | 'movers'
    let currentThreshold = 3.0;
    let moversData = null;
    let candleData = [];
    let currentDrawerTab = 'ai';
    let isDark = false;
    let userZoom = parseFloat(localStorage.getItem('mw-zoom') || '2');

    let chart = null;
    let candleSeries = null;
    let volumeSeries = null;
    let gridChartInstances = [];

    // Elements
    const sidebar = document.getElementById('sidebar');
    const intelDrawer = document.getElementById('intel-drawer');
    const stockListEl = document.getElementById('stock-list');
    const drawerContent = document.getElementById('drawer-content');
    const floatTip = document.getElementById('float-tip');
    const chartBox = document.getElementById('chart-box');
    const gridBox = document.getElementById('grid-box');
    const paletteModal = document.getElementById('palette-modal');
    const paletteInput = document.getElementById('palette-input');
    const paletteList = document.getElementById('palette-list');
    const toastEl = document.getElementById('toast');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    function formatPrice(val) {
      return Number(val).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatVol(val) {
      if (val >= 1e7) return (val / 1e7).toFixed(2) + ' Cr';
      if (val >= 1e5) return (val / 1e5).toFixed(2) + ' L';
      if (val >= 1e3) return (val / 1e3).toFixed(1) + ' K';
      return String(val);
    }

    // Initialize Lightweight Chart
    function initChart() {
      const container = document.getElementById('chart-canvas');
      container.innerHTML = '';

      const bgColor = isDark ? '#111726' : '#ffffff';
      const gridColor = isDark ? '#1a233a' : '#f1f5f9';
      const textColor = isDark ? '#94a3b8' : '#64748b';

      chart = LightweightCharts.createChart(container, {
        layout: {
          background: { color: bgColor },
          textColor: textColor,
          fontFamily: "'JetBrains Mono', monospace",
        },
        grid: {
          vertLines: { color: gridColor },
          horzLines: { color: gridColor },
        },
        rightPriceScale: {
          borderColor: isDark ? '#232e47' : '#e2e8f0',
          autoScale: true,
          scaleMargins: { top: 0.05, bottom: 0.2 },
        },
        timeScale: {
          borderColor: isDark ? '#232e47' : '#e2e8f0',
          timeVisible: true,
          secondsVisible: false,
          barSpacing: userZoom,
          rightOffset: Math.max(3, Math.round(userZoom + 2)),
          minBarSpacing: 0.5,
        },
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#16a34a',
        downColor: '#dc2626',
        borderUpColor: '#16a34a',
        borderDownColor: '#dc2626',
        wickUpColor: '#16a34a',
        wickDownColor: '#dc2626',
      });

      volumeSeries = chart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceScaleId: '',
      });
      volumeSeries.priceScale().applyOptions({
        scaleMargins: { top: 0.8, bottom: 0 },
      });

      // Hover crosshair listener for real-time tooltip and OHLC update
      chart.subscribeCrosshairMove(param => {
        if (!param.point || !param.time) {
          floatTip.style.display = 'none';
          updateHeaderFromLatest();
          return;
        }

        const candle = param.seriesData.get(candleSeries);
        if (!candle) {
          floatTip.style.display = 'none';
          updateHeaderFromLatest();
          return;
        }

        const diff = candle.close - candle.open;
        const pct = (diff / candle.open) * 100;
        const isUp = diff >= 0;
        const sign = isUp ? '+' : '';

        // Update Top OHLC
        document.getElementById('ohlc-open').textContent = formatPrice(candle.open);
        document.getElementById('ohlc-high').textContent = formatPrice(candle.high);
        document.getElementById('ohlc-low').textContent = formatPrice(candle.low);
        document.getElementById('ohlc-close').textContent = formatPrice(candle.close);
        const chgSpan = document.getElementById('ohlc-chg');
        chgSpan.textContent = `${sign}${pct.toFixed(2)}%`;
        chgSpan.style.color = isUp ? 'var(--bullish)' : 'var(--bearish)';

        const vol = param.seriesData.get(volumeSeries);
        if (vol) {
          document.getElementById('ohlc-vol').textContent = formatVol(vol.value);
        }

        // Floating tooltip at cursor
        floatTip.textContent = `${sign}${pct.toFixed(2)}% (${sign}₹${diff.toFixed(2)})`;
        floatTip.className = `candle-float-tip ${isUp ? 'up' : 'down'}`;
        floatTip.style.display = 'block';
        floatTip.style.left = `${param.point.x}px`;
        floatTip.style.top = `${param.point.y}px`;
      });
    }

    function updateHeaderFromLatest() {
      if (!candleData || candleData.length === 0) return;
      const latest = candleData[candleData.length - 1];
      const diff = latest.close - latest.open;
      const pct = (diff / latest.open) * 100;
      const isUp = diff >= 0;
      const sign = isUp ? '+' : '';

      document.getElementById('ohlc-open').textContent = formatPrice(latest.open);
      document.getElementById('ohlc-high').textContent = formatPrice(latest.high);
      document.getElementById('ohlc-low').textContent = formatPrice(latest.low);
      document.getElementById('ohlc-close').textContent = formatPrice(latest.close);
      const chgSpan = document.getElementById('ohlc-chg');
      chgSpan.textContent = `${sign}${pct.toFixed(2)}%`;
      chgSpan.style.color = isUp ? 'var(--bullish)' : 'var(--bearish)';
      document.getElementById('ohlc-vol').textContent = formatVol(latest.volume);
    }

    // Fetch and Load Chart Data from Backend (with SQLite caching)
    async function fetchChartData(force = false) {
      const activeList = currentTab === 'movers' ? getFilteredMovers() : stocks;
      if (activeList.length === 0) return;
      const stock = activeList[currentIndex] || activeList[0];
      if (!stock) return;

      document.getElementById('hero-sym').textContent = stock.symbol;

      const startTime = performance.now();
      try {
        const url = `/api/candles?symbol=${encodeURIComponent(stock.symbol)}&timeframe=${currentTimeframe}${force ? '&force=true' : ''}`;
        const res = await fetch(url);
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to fetch');
        }

        const cacheHeader = res.headers.get('x-cache') || 'UNKNOWN';
        const elapsed = (performance.now() - startTime).toFixed(1);
        document.getElementById('cache-latency').textContent = `${cacheHeader === 'HIT' ? 'Hit' : 'Miss'} (${elapsed}ms)`;

        candleData = await res.json();
        renderChartData(candleData);
        renderDrawerTab(currentDrawerTab);
      } catch (e) {
        showToast('Error: ' + e.message);
      }
    }

    function renderChartData(data) {
      if (!data || data.length === 0) return;

      const candles = data.map(c => ({
        time: c.timestamp,
        open: c.open,
        high: c.high,
        low: c.low,
        close: c.close,
      }));

      const volumes = data.map(c => ({
        time: c.timestamp,
        value: c.volume,
        color: c.close >= c.open ? 'rgba(22, 163, 74, 0.3)' : 'rgba(220, 38, 38, 0.3)',
      }));

      candleSeries.setData(candles);
      volumeSeries.setData(volumes);
      chart.timeScale().fitContent();

      // Apply zoom spacing after fitContent
      chart.timeScale().applyOptions({
        barSpacing: userZoom,
        rightOffset: Math.max(3, Math.round(userZoom + 2)),
        minBarSpacing: 0.5,
      });

      // Update hero price
      const latest = candles[candles.length - 1];
      const prev = candles.length > 1 ? candles[candles.length - 2] : latest;
      const chg = ((latest.close - prev.close) / prev.close) * 100;
      const isUp = chg >= 0;

      document.getElementById('hero-price').textContent = `₹${formatPrice(latest.close)}`;
      const chgEl = document.getElementById('hero-chg');
      chgEl.textContent = `${isUp ? '+' : ''}${chg.toFixed(2)}%`;
      chgEl.style.color = isUp ? 'var(--bullish)' : 'var(--bearish)';

      updateHeaderFromLatest();
    }

    // Load Stock Universe from Backend
    async function loadStocks() {
      try {
        const res = await fetch('/api/stocks');
        stocks = await res.json();
        document.getElementById('count-universe').textContent = stocks.length;
        renderStockList();
        if (stocks.length > 0) {
          selectStock(0);
        }
      } catch (e) {
        showToast('Failed to load stock list: ' + e.message);
      }
    }

    function renderStockList(filter = '') {
      stockListEl.innerHTML = '';
      const q = filter.trim().toLowerCase();
      const filtered = q
        ? stocks.filter(s => s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))
        : stocks;

      filtered.forEach((s, idx) => {
        const li = document.createElement('li');
        li.className = 'stock-row' + (idx === currentIndex && currentTab === 'universe' ? ' active' : '');
        li.innerHTML = `
          <div>
            <div class="stock-sym-title">${s.symbol}</div>
            <div class="stock-corp-name">${s.name}</div>
          </div>
          <button style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px;" onclick="event.stopPropagation(); deleteStock('${s.symbol}')">✕</button>
        `;
        li.addEventListener('click', () => {
          selectStock(idx);
          if (currentViewMode === 'grid') {
            setViewMode('single');
          }
        });
        stockListEl.appendChild(li);
      });
    }

    function selectStock(index) {
      const activeList = currentTab === 'movers' ? getFilteredMovers() : stocks;
      if (index < 0 || index >= activeList.length) return;
      currentIndex = index;

      document.querySelectorAll('.stock-row').forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });

      const activeEl = document.querySelector('.stock-row.active');
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      if (currentViewMode === 'single') {
        fetchChartData();
      } else {
        renderDrawerTab(currentDrawerTab);
      }
    }

    async function deleteStock(symbol) {
      if (!confirm(`Remove ${symbol} from universe?`)) return;
      try {
        const res = await fetch(`/api/stocks/${encodeURIComponent(symbol)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete failed');
        showToast(`Removed ${symbol}`);
        stocks = stocks.filter(s => s.symbol !== symbol);
        document.getElementById('count-universe').textContent = stocks.length;
        renderStockList();
      } catch (e) {
        showToast('Error: ' + e.message);
      }
    }

    async function addStock(symbol, name) {
      if (!symbol) return;
      let sym = symbol.toUpperCase().trim();
      if (!sym.includes('.')) sym += '.NS';
      try {
        const res = await fetch('/api/stocks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ symbol: sym, name: name.trim() || sym, tags: [] }),
        });
        if (!res.ok) throw new Error('Failed to add');
        showToast(`Added ${sym}`);
        document.getElementById('modal-add').classList.remove('open');
        await loadStocks();
      } catch (e) {
        showToast('Error: ' + e.message);
      }
    }

    // Movers Screener
    function getFilteredMovers() {
      if (!moversData || !moversData.movers) return [];
      return moversData.movers.filter(m => Math.abs(m.change_percent) >= currentThreshold);
    }

    async function loadCachedMovers() {
      try {
        const res = await fetch('/api/scan/cached');
        const data = await res.json();
        if (data) {
          moversData = data;
          updateMoversCount();
          if (currentTab === 'movers') renderMoversList();
        }
      } catch (e) {
        console.warn('No cached movers:', e);
      }
    }

    async function runScanMovers(force = true) {
      showToast('Scanning 150+ stocks for movers...');
      try {
        const res = await fetch(`/api/scan?threshold=${currentThreshold}&force=${force}`);
        if (!res.ok) throw new Error('Scan failed');
        moversData = await res.json();
        updateMoversCount();
        if (currentTab === 'movers') renderMoversList();
        if (currentViewMode === 'grid') renderMultiChartGrid();
        showToast(`Scan complete: ${moversData.movers_count} movers`);
      } catch (e) {
        showToast('Scan error: ' + e.message);
      }
    }

    function updateMoversCount() {
      const count = getFilteredMovers().length;
      document.getElementById('count-movers').textContent = count;
    }

    function renderMoversList() {
      stockListEl.innerHTML = '';
      const list = getFilteredMovers();
      if (list.length === 0) {
        stockListEl.innerHTML = `
          <div style="padding: 24px 14px; text-align: center; color: var(--text-muted); font-size: 12px;">
            No movers beyond ±${currentThreshold}% found.<br/><br/>
            <button class="add-btn" onclick="runScanMovers(true)">Refresh Scan</button>
          </div>
        `;
        return;
      }

      list.forEach((m, idx) => {
        const li = document.createElement('li');
        li.className = 'stock-row' + (idx === currentIndex ? ' active' : '');
        const isUp = m.change_percent >= 0;
        li.innerHTML = `
          <div>
            <div class="stock-sym-title">${m.symbol}</div>
            <div class="stock-corp-name">${m.name}</div>
          </div>
          <div style="text-align: right;">

    // View Mode Switching (Single Focus vs Multi Grid)
    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btn-rail-chart').classList.toggle('active', mode === 'single');
      document.getElementById('btn-rail-grid').classList.toggle('active', mode === 'grid');

      if (mode === 'single') {
        chartBox.style.display = 'block';
        gridBox.style.display = 'none';
        initChart();
        fetchChartData();
      } else {
        chartBox.style.display = 'none';
        gridBox.style.display = 'grid';
        renderMultiChartGrid();

    async function renderMultiChartGrid() {
      gridChartInstances.forEach(c => c.remove());
      gridChartInstances = [];
      gridBox.innerHTML = '';

      const list = getFilteredMovers();
      if (list.length === 0) {
        gridBox.innerHTML = `
          <div style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--text-muted); gap: 12px;">
            <div style="font-size: 15px; font-weight: 600;">No movers beyond ±${currentThreshold}%</div>
            <div style="font-size: 12px;">Adjust threshold or click Refresh Scan.</div>
          </div>
        `;
        return;
      }

      const bgColor = isDark ? '#111726' : '#ffffff';
      const textColor = isDark ? '#94a3b8' : '#64748b';
      const gridColor = isDark ? '#1a233a' : '#f1f5f9';

      for (const m of list) {
        const card = document.createElement('div');
        card.className = 'grid-chart-card';
        card.id = `card-${m.symbol}`;
        const isUp = m.change_percent >= 0;

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div style="font-family: var(--font-mono); font-weight: 700; font-size: 13px;">${m.symbol}</div>
              <div style="font-size: 11px; color: var(--text-muted);">${m.name}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-family: var(--font-mono); font-weight: 700; font-size: 13px;">₹${formatPrice(m.price)}</div>
              <span class="stock-badge-pill ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${m.change_percent.toFixed(2)}%</span>
            </div>
          </div>
          <div class="grid-chart-canvas"></div>
        `;

        card.addEventListener('click', () => {
          const idx = (currentTab === 'movers' ? getFilteredMovers() : stocks).findIndex(s => s.symbol === m.symbol);
          if (idx !== -1) selectStock(idx);
          setViewMode('single');
        });

        gridBox.appendChild(card);

        const canvasEl = card.querySelector('.grid-chart-canvas');
        const miniChart = LightweightCharts.createChart(canvasEl, {
          layout: { background: { color: bgColor }, textColor, fontFamily: "'JetBrains Mono', monospace" },
          grid: { vertLines: { color: gridColor }, horzLines: { color: gridColor } },
          rightPriceScale: { borderColor: isDark ? '#232e47' : '#e2e8f0', autoScale: true, scaleMargins: { top: 0.05, bottom: 0.15 } },
          timeScale: { borderColor: isDark ? '#232e47' : '#e2e8f0', timeVisible: true, secondsVisible: false, barSpacing: userZoom, rightOffset: 3 },
        });
        gridChartInstances.push(miniChart);

        const miniSeries = miniChart.addCandlestickSeries({
          upColor: '#16a34a', downColor: '#dc2626', borderUpColor: '#16a34a', borderDownColor: '#dc2626', wickUpColor: '#16a34a', wickDownColor: '#dc2626',
        });

        fetch(`/api/candles?symbol=${encodeURIComponent(m.symbol)}&timeframe=${currentTimeframe}`)
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              miniSeries.setData(data.map(c => ({ time: c.timestamp, open: c.open, high: c.high, low: c.low, close: c.close })));
              miniChart.timeScale().fitContent();
              miniChart.timeScale().applyOptions({ barSpacing: userZoom, rightOffset: 3 });
            }
          })
          .catch(console.warn);
      }
    }

    // Right Drawer Content (AI Insights, Fundamentals, System Commands)
    async function renderDrawerTab(tabKey) {
      currentDrawerTab = tabKey;
      document.querySelectorAll('.drawer-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tabKey);
      });

      const activeList = currentTab === 'movers' ? getFilteredMovers() : stocks;
      const stock = activeList[currentIndex] || activeList[0] || { symbol: 'RELIANCE.NS', name: 'Reliance Industries' };

      if (tabKey === 'ai') {
        // Calculate algorithmic pivot levels from recent candles
        let pivot = '--', r1 = '--', s1 = '--', r2 = '--', s2 = '--', pattern = 'Analyzing momentum...';
        let sentiment = 'NEUTRAL', sentColor = 'var(--accent)', sentScore = '55%';

        if (candleData && candleData.length >= 2) {
          const last = candleData[candleData.length - 1];
          const prev = candleData[candleData.length - 2];
          const h = last.high, l = last.low, c = last.close;
          const p = (h + l + c) / 3;
          pivot = formatPrice(p);
          r1 = formatPrice((2 * p) - l);
          s1 = formatPrice((2 * p) - h);
          r2 = formatPrice(p + (h - l));
          s2 = formatPrice(p - (h - l));

          // Candlestick pattern detection
          const lastBody = Math.abs(last.close - last.open);
          const prevBody = Math.abs(prev.close - prev.open);

          if (last.close > last.open && prev.close < prev.open && last.close > prev.open && last.open < prev.close) {
            pattern = 'Bullish Engulfing pattern detected on volume expansion.';
            sentiment = 'BULLISH'; sentColor = 'var(--bullish)'; sentScore = '82%';
          } else if (last.close < last.open && prev.close > prev.open && last.open > prev.close && last.close < prev.open) {
            pattern = 'Bearish Engulfing pattern detected near local resistance.';
            sentiment = 'BEARISH'; sentColor = 'var(--bearish)'; sentScore = '76%';
          } else if (last.close >= last.open && (last.open - last.low) > 2 * lastBody && (last.high - last.close) < lastBody * 0.3) {
            pattern = 'Hammer pattern forming near support zone.';
            sentiment = 'BULLISH'; sentColor = 'var(--bullish)'; sentScore = '70%';
          } else if (lastBody < (last.high - last.low) * 0.1) {
            pattern = 'Doji indecision bar at key level.';
            sentiment = 'NEUTRAL'; sentColor = 'var(--accent)'; sentScore = '50%';
          } else if (last.close >= last.open) {
            pattern = 'Bullish continuation structure holding above VWAP.';
            sentiment = 'BULLISH'; sentColor = 'var(--bullish)'; sentScore = '65%';
          } else {
            pattern = 'Distribution pressure testing session lows.';
            sentiment = 'BEARISH'; sentColor = 'var(--bearish)'; sentScore = '62%';
          }
        }

        drawerContent.innerHTML = `
          <div class="ai-insight-box">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-weight: 700; font-size: 12px; color: var(--purple);">🧠 Technical & Pattern Synthesis</span>
              <span style="font-size: 10px; background: ${sentColor}; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 700;">${sentiment} (${sentScore})</span>
            </div>
            <div style="font-size: 11px; color: var(--text-secondary); line-height: 1.5;">
              ${stock.symbol} (${currentTimeframe}): ${pattern}
            </div>
          </div>

          <div class="drawer-card">
            <div class="drawer-card-title">
              <span>🎯 Algorithmic Floor Pivots</span>
              <span style="font-size: 10px; color: var(--text-muted);">${currentTimeframe} Bar</span>
            </div>
            <div class="metric-grid">
              <div class="metric-box">
                <div class="metric-lbl">Resistance 2 (R2)</div>
                <div class="metric-val" style="color: var(--bearish);">₹${r2}</div>
              </div>
              <div class="metric-box">
                <div class="metric-lbl">Resistance 1 (R1)</div>
                <div class="metric-val" style="color: var(--bearish);">₹${r1}</div>
              </div>
              <div class="metric-box">
                <div class="metric-lbl">Central Pivot (P)</div>
                <div class="metric-val" style="color: var(--accent);">₹${pivot}</div>
              </div>
              <div class="metric-box">
                <div class="metric-lbl">Support 1 (S1)</div>
                <div class="metric-val" style="color: var(--bullish);">₹${s1}</div>
              </div>
              <div class="metric-box" style="grid-column: 1 / -1;">
                <div class="metric-lbl">Support 2 (S2)</div>
                <div class="metric-val" style="color: var(--bullish);">₹${s2}</div>
              </div>
            </div>
          </div>

          <div class="drawer-card">
            <div class="drawer-card-title">
              <span>⚡ AI Research Harness Roadmap</span>
            </div>
            <div style="font-size: 11px; color: var(--text-secondary); line-height: 1.5;">

              • LLM Multi-Timeframe Confluence Synthesis<br/>
              • Risk/Reward Ratio & Stop Loss Engine
            </div>
          </div>
        `;
      } else if (tabKey === 'fundamentals') {
        drawerContent.innerHTML = `
          <div class="drawer-card">
            <div class="drawer-card-title">
              <span>📊 Active Stock Information</span>
              <span style="font-size: 10px; color: var(--text-muted);">${stock.symbol}</span>
            </div>
            <div class="metric-grid">
              <div class="metric-box">
                <div class="metric-lbl">Symbol</div>
                <div class="metric-val" style="font-size: 11px;">${stock.symbol}</div>
              </div>
              <div class="metric-box">
                <div class="metric-lbl">Exchange</div>
                <div class="metric-val">NSE (India)</div>
              </div>

                <div class="metric-lbl">Loaded Bars</div>

                <div class="metric-val">${currentTimeframe}</div>

      } else if (tabKey === 'system') {

        try {

          if (res.ok) {

        drawerContent.innerHTML = `

            <div style="font-size: 11px; color: var(--text-secondary); line-height: 1.6;">

      }

    // Command Palette Setup
    const paletteActions = [

        fetch('/api/scan/state').then(() => showToast('Command: systemctl --user restart marketwatch-web.service'));

    function openPalette() {
      paletteModal.classList.add('open');
      paletteInput.value = '';
      renderPaletteList(paletteActions);
      setTimeout(() => paletteInput.focus(), 50);
    }

    function closePalette() {
      paletteModal.classList.remove('open');
    }

    function renderPaletteList(actions) {
      paletteList.innerHTML = '';
      actions.forEach((a, i) => {
        const li = document.createElement('li');
        li.className = 'palette-item' + (i === 0 ? ' selected' : '');
        li.innerHTML = `<span>${a.name}</span><span class="palette-item-tag">${a.tag}</span>`;
        li.addEventListener('click', () => {
          a.run();
          closePalette();
        });
        paletteList.appendChild(li);
      });
    }

    paletteInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const stockActions = stocks
        .filter(s => s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))
        .slice(0, 5)
        .map(s => ({
          name: `Switch to ${s.symbol} (${s.name})`,
          tag: 'stock',
          run: () => {
            const idx = stocks.findIndex(x => x.symbol === s.symbol);
            if (idx !== -1) selectStock(idx);
          }
        }));

      const filteredCmds = paletteActions.filter(a => a.name.toLowerCase().includes(q) || a.tag.toLowerCase().includes(q));
      renderPaletteList([...stockActions, ...filteredCmds]);
    });

    document.getElementById('btn-rail-watchlist').addEventListener('click', () => {

    zoomRange.addEventListener('input', (e) => {

      if (chart && currentViewMode === 'single') {

    // Theme Toggle
    function toggleTheme() {
      isDark = !isDark;
      document.body.classList.toggle('dark-theme', isDark);
      document.getElementById('rail-theme-icon').textContent = isDark ? '☀️' : '🌙';
      initChart();
      if (candleData.length > 0) renderChartData(candleData);
      if (currentViewMode === 'grid') renderMultiChartGrid();
    }
    document.getElementById('btn-rail-theme').addEventListener('click', toggleTheme);

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        if (e.key === 'Escape') {
          document.activeElement.blur();
          closePalette();
          document.getElementById('modal-add').classList.remove('open');
        }
        return;
      }

      const activeList = currentTab === 'movers' ? getFilteredMovers() : stocks;
      if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'J') {
        e.preventDefault();
        if (activeList.length > 0) selectStock((currentIndex + 1) % activeList.length);
      } else if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'K') {
        e.preventDefault();
        if (activeList.length > 0) selectStock((currentIndex - 1 + activeList.length) % activeList.length);
      } else if (['1','2','3','4','5','6'].includes(e.key)) {
        const tfMap = { '1':'5m', '2':'15m', '3':'30m', '4':'1h', '5':'1d', '6':'1w' };
        setTimeframe(tfMap[e.key]);
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        if (currentTab === 'movers') runScanMovers(true);
        else fetchChartData(true);
      } else if (e.key === 't' || e.key === 'T') {
        e.preventDefault();
        toggleTheme();
      } else if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        if (currentTab === 'universe') tabMovers.click();
        else tabUniverse.click();
      } else if (e.key === 'g' || e.key === 'G') {
        e.preventDefault();
        setViewMode(currentViewMode === 'single' ? 'grid' : 'single');
      } else if (e.key === 'i' || e.key === 'I') {
        e.preventDefault();
        toggleIntelDrawer();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openPalette();
      } else if (e.key === '/') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      } else if (e.key === 'Escape') {
        closePalette();
        document.getElementById('modal-add').classList.remove('open');
      }
    });

      if (chart) chart.resize(document.getElementById('chart-canvas').clientWidth, document.getElementById('chart-canvas').clientHeight);
    });

    // Check Market Status (Indian Standard Time UTC+5:30)
    function updateMarketStatus() {
      const now = new Date();
      // UTC to IST
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const ist = new Date(utc + (3600000 * 5.5));
      const day = ist.getDay(); // 0 Sun, 6 Sat
      const hours = ist.getHours();
      const mins = ist.getMinutes();
      const totalMins = hours * 60 + mins;

      const isWeekday = day >= 1 && day <= 5;
      const isOpen = isWeekday && totalMins >= (9 * 60 + 15) && totalMins < (15 * 60 + 30);

      const dot = document.getElementById('market-dot');
      const lbl = document.getElementById('market-status-lbl');

      if (isOpen) {
        dot.style.background = 'var(--bullish)';
        lbl.textContent = 'NSE: Live (09:15 - 15:30 IST)';
      } else {
        dot.style.background = 'var(--bearish)';
        lbl.textContent = 'NSE: Market Closed';
      }
    }

    // Init App
    window.addEventListener('DOMContentLoaded', () => {
      initChart();
      loadStocks();
      loadCachedMovers();
      updateMarketStatus();
    });
  </script>
</body>
</html>
