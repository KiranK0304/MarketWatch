<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Head Gradient: Warm, bright geeky gold -->
    <radialGradient id="headGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Glass Lens Gradient -->
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e2e8f0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Gloss Sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Round Nerd Head -->
  <circle cx="32" cy="32" r="28" fill="url(#headGrad)" stroke="#a16207" stroke-width="1.6"/>

  <!-- 2. Cute Geek Cowlick / Hair Sprouts -->
  <path d="M 30 5 C 31 1 35 1.5 33.5 5 C 36 2.5 39 4 36.5 7" stroke="#a16207" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 3. Raised Nerdy Eyebrows -->
  <path d="M 11 11 Q 17.5 7.5 24 10.5" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 40 10.5 Q 46.5 7.5 53 11" stroke="#78350f" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- 4. Rosy Cheeks -->
  <ellipse cx="11.5" cy="36" rx="4" ry="2.2" fill="#f43f5e" opacity="0.45"/>
  <ellipse cx="52.5" cy="36" rx="4" ry="2.2" fill="#f43f5e" opacity="0.45"/>

  <!-- 5. Big Open Smile & Buck Teeth -->
  <path d="M 21 37 Q 32 50 43 37 Z" fill="#3b0764"/>
  <path d="M 25 44 Q 32 40 39 44 Q 32 50 25 44 Z" fill="#f43f5e"/>

  <!-- Two White Square Buck Teeth -->
  <rect x="27.5" y="37" width="4" height="6" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>
  <rect x="32.5" y="37" width="4" height="6" rx="1" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>

  <!-- 6. Thick Black Nerd Glasses -->
  <!-- Left Outer Frame -->
  <rect x="6.5" y="14" width="22" height="19" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
  <!-- Right Outer Frame -->
  <rect x="35.5" y="14" width="22" height="19" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
  <!-- Central Bridge -->
  <rect x="26" y="21" width="12" height="5" fill="#090d16"/>
  <!-- Temples (Side arms) -->
  <path d="M 6.5 21 L 4 23" stroke="#090d16" stroke-width="3" stroke-linecap="round"/>
  <path d="M 57.5 21 L 60 23" stroke="#090d16" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Inner Lens -->
  <rect x="9" y="16.5" width="17" height="14" rx="4" fill="url(#lensGrad)"/>
  <!-- Right Inner Lens -->
  <rect x="38" y="16.5" width="17" height="14" rx="4" fill="url(#lensGrad)"/>

  <!-- Mini Candlestick reflection in Left Lens (Market Quant Easter Egg!) -->
  <line x1="12" y1="18.5" x2="12" y2="28" stroke="#16a34a" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <rect x="10.8" y="21" width="2.4" height="4.5" rx="0.5" fill="#22c55e" opacity="0.7"/>

  <!-- Big Focused Pupils Looking Up/Right -->
  <!-- Left Eye -->
  <circle cx="19.5" cy="23.5" r="4.2" fill="#0f172a"/>
  <circle cx="18" cy="22" r="1.6" fill="#ffffff"/>
  <circle cx="21" cy="25" r="0.7" fill="#ffffff"/>

  <!-- Right Eye -->
  <circle cx="48.5" cy="23.5" r="4.2" fill="#0f172a"/>
  <circle cx="47" cy="22" r="1.6" fill="#ffffff"/>
  <circle cx="50" cy="25" r="0.7" fill="#ffffff"/>

  <!-- Diagonal Glass Glare on lenses -->
  <path d="M 10 17 L 22 17 L 14 28 L 10 28 Z" fill="url(#sheen)" opacity="0.4"/>
  <path d="M 39 17 L 51 17 L 43 28 L 39 28 Z" fill="url(#sheen)" opacity="0.4"/>

  <!-- 7. THE WHITE TAPE WRAP ON THE BRIDGE -->
  <rect x="29" y="18.5" width="6" height="10" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.9"/>
  <!-- Tape wrap bands -->
  <line x1="29.5" y1="21.5" x2="34.5" y2="21.5" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="29.5" y1="25.5" x2="34.5" y2="25.5" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- 8. Green Bullish Bow-Tie at bottom -->
  <path d="M 23 54 L 32 57.5 L 23 61 Z" fill="#22c55e" stroke="#15803d" stroke-width="0.8"/>
  <path d="M 41 54 L 32 57.5 L 41 61 Z" fill="#22c55e" stroke="#15803d" stroke-width="0.8"/>
  <circle cx="32" cy="57.5" r="2.6" fill="#16a34a" stroke="#15803d" stroke-width="0.6"/>
</svg>
