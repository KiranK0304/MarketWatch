[package]
name = "market-watch"
version = "0.1.0"
edition = "2024"
description = "Personal terminal-driven stock market visualization"

[[bin]]
name = "market"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# GUI
eframe = "0.31"
egui_plot = "0.31"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"
axum = "0.8.9"
webbrowser = "1.2.4"
